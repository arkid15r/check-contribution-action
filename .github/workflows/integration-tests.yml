name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integration-tests.yml
      - .github/scripts/integration/**
      - src/**
      - action.yml
      - Dockerfile
      - entrypoint.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integration-tests.yml
      - .github/scripts/integration/**
      - src/**
      - action.yml
      - Dockerfile
      - entrypoint.sh

concurrency:
  cancel-in-progress: false
  group: integration-tests-${{ github.repository }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: integration-build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build action Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: check-contribution-action:integration-test
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save check-contribution-action:integration-test | gzip > integration-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-docker-image
          path: integration-image.tar.gz
          retention-days: 1

  integration:
    name: integration-${{ matrix.case }}
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      INTEGRATION_SKIP_DOCKER_BUILD: "true"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    strategy:
      fail-fast: false
      matrix:
        case:
          - commit-sign-off-fail
          - commit-sign-off-merge-pass
          - commit-sign-off-pass
          - commit-signature-fail
          - issue-assignee-fail
          - issue-linked-fail
          - issue-linked-pass
          - issue-reference-fail
          - issue-reference-pass
          - target-branch-fail
          - target-branch-pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-docker-image

      - name: Load Docker image
        run: gunzip -c integration-image.tar.gz | docker load

      - name: Run integration case
        env:
          CASE_ID: ${{ matrix.case }}
        run: bash .github/scripts/integration/run_case.sh "${{ matrix.case }}"

  cleanup:
    name: integration-cleanup
    runs-on: ubuntu-latest
    needs: integration
    # Run after a real integration attempt. A skipped integration job has nothing to clean up,
    # and this job would fail under Dependabot's read-only token.
    if: always() && needs.integration.result != 'skipped'
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove integration test artifacts
        run: bash .github/scripts/integration/cleanup_run.sh "${{ github.run_id }}"
